name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Integration
          submodules: recursive
      - name: Build unsigned
        run: |
          PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" -not -path "./moonlight-common/*" -not -path "./X1Kit/*" | head -1)
          echo "Project: $PROJ"
          xcodebuild -project "$PROJ" -list
          SCHEME=$(xcodebuild -project "$PROJ" -list -json | python3 -c "import json,sys; s=json.load(sys.stdin)['project']['schemes']; print(next((x for x in s if x in ('Moonlight','VoidLink','Limelight')), s[0]))")
          echo "Scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Make IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: app.ipa
